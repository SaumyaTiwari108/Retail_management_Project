server.port=8080
server.servlet.context-path=/api

spring.application.name=PRG_RIMS_001

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:rims_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# App & Security Settings
app.jwt.secret=PRG_RIMS_001_SUPER_SECURE_JWT_SECRET_KEY_FOR_XYZ_RETAIL_ENTERPRISE_SYSTEM_2026_ABCDEF1234567890
app.jwt.expiration-ms=86400000

# CORS
app.cors.allowed-origins=http://localhost:4200,http://127.0.0.1:4200

# Swagger OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
